# =============================================================================================================
# Cloudflare Worker 配置文件 - JokerMusic
# 部署命令: pip install uv && uv sync && uv run pywrangler deploy
# 本地开发: pip install uv && uv sync && uv run pywrangler dev
# =============================================================================================================

name = "joker-music"
main = "JokerMusic_Worker.py"
compatibility_date = "2026-10-10"
compatibility_flags = ["python_workers"]

# -------------------------------------------------------------------------------------------------------------
# 静态资源目录（Workers Assets）
# Workers Assets 会自动通过 env.ASSETS.fetch() 提供这些文件
# -------------------------------------------------------------------------------------------------------------
[assets]
directory = "./static"

# -------------------------------------------------------------------------------------------------------------
# KV 命名空间绑定
# 用途: 存储登录 Session (session:*) 和歌库缓存 (cache:song_list)
#
# 创建命令:
#     npx wrangler kv namespace create JokerMusicKV
# 输出: { binding = "JokerMusicKV", id = "xxxxxxxxxxxxxxxx" }
# -------------------------------------------------------------------------------------------------------------
[[kv_namespaces]]
binding = "JokerMusicKV"
id = "5c4510986b704c7a89c57df909c0c3e2"

# -------------------------------------------------------------------------------------------------------------
# R2 存储桶绑定
# 用途: 存储音乐文件 (music/*.mp3) 和歌词文件 (lyrics/*.lrc)
#
# 创建命令:
#     npx wrangler r2 bucket create JokerMusicLibrary
# -------------------------------------------------------------------------------------------------------------
[[r2_buckets]]
binding = "JokerMusicLibrary"
bucket_name = "joker-music-library"

# -------------------------------------------------------------------------------------------------------------
# 非敏感环境变量
# -------------------------------------------------------------------------------------------------------------
[vars]
APP_NAME = "Joker’s Music"

# R2 中的路径
MUSIC_PREFIX  = "music/"
LYRIC_PREFIX  = "lyrics/"

# KV 缓存
CACHE_KEY     = "cache:song_list"   # 歌库缓存
CACHE_TTL     = 86400               # 歌库缓存 24 小时自动过期

# JWT Token 有效期 (30 天免登录)
TOKEN_TTL_DAYS = 30

# Cookie 名称
COOKIE_NAME = "session_token"

# ID3 读取前 512KB (字节)
ID3_HEADER_SIZE = 524288

# -------------------------------------------------------------------------------------------------------------
# 敏感变量:
#     SITE_PASSWORD
#     JWT_SECRET
# 在 Dashboard 中设置 Secret:
#     Worker → Settings → Variables and Secrets → Secrets → Add: SITE_PASSWORD
# 或者用命令:
#     npx wrangler secret put SITE_PASSWORD
# -------------------------------------------------------------------------------------------------------------

# -------------------------------------------------------------------------------------------------------------
# 自定义域名
# -------------------------------------------------------------------------------------------------------------
